services:
  api:
    build:
      context: .
      target: api
    env_file: apps/api/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3085
      TRUST_PROXY: 1
    restart: unless-stopped
    expose: ["3085"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3085/api/v1/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api:
        condition: service_healthy
